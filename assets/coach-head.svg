<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinTone1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0BD"/>
      <stop offset="100%" stop-color="#F2C99D"/>
    </linearGradient>
    <linearGradient id="capGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8B0A1E"/>
    </linearGradient>
    <linearGradient id="shirtGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242832"/>
      <stop offset="100%" stop-color="#171920"/>
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad1)"/>
  <circle cx="200" cy="190" r="140" fill="url(#aura1)"/>

  <!-- Subtle Zen Halo Circle -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Long Hair (Back) -->
  <path d="M125,170 C110,230 115,310 145,340 C155,310 155,270 155,240 Z" fill="#2C221E"/>
  <path d="M275,170 C290,230 285,310 255,340 C245,310 245,270 245,240 Z" fill="#2C221E"/>

  <!-- Body / Shoulders (Athletic Lean) -->
  <path d="M100,480 C100,385 140,360 170,355 L230,355 C260,360 300,385 300,480 Z" fill="url(#shirtGrad1)"/>
  <!-- Collar Line / Neck Opening -->
  <path d="M170,355 C170,380 230,380 230,355 Z" fill="#FFE0BD"/>
  <path d="M165,355 C175,390 225,390 235,355" fill="none" stroke="#C8102E" stroke-width="4"/>

  <!-- Neck -->
  <rect x="178" y="270" width="44" height="95" rx="8" fill="url(#skinTone1)"/>
  <path d="M178,320 C190,335 210,335 222,320 Z" fill="#E2B788" opacity="0.6"/>

  <!-- Head / Face -->
  <path d="M148,160 C148,110 252,110 252,160 C252,225 240,290 200,290 C160,290 148,225 148,160 Z" fill="url(#skinTone1)"/>

  <!-- Short Neat Beard -->
  <path d="M152,195 C152,270 170,294 200,294 C230,294 248,270 248,195 C248,225 238,285 200,285 C162,285 152,225 152,195 Z" fill="#3B2D26"/>
  <!-- Stubble & Mustache -->
  <path d="M182,236 C190,232 210,232 218,236 C214,242 186,242 182,236 Z" fill="#3B2D26"/>
  <path d="M192,260 C196,268 204,268 208,260 C204,264 196,264 192,260 Z" fill="#3B2D26"/>

  <!-- Warm, Genuine, Peaceful Smile -->
  <path d="M180,242 C186,258 214,258 220,242" fill="none" stroke="#9E5B32" stroke-width="3" stroke-linecap="round"/>
  <path d="M183,243 C190,253 210,253 217,243 Z" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M196,192 C194,212 192,218 200,220 C205,220 206,215 204,210" fill="none" stroke="#DCA272" stroke-width="3" stroke-linecap="round"/>

  <!-- Peaceful Zen Eyes (Smiling curved arcs) -->
  <path d="M166,182 C172,174 182,174 188,182" fill="none" stroke="#2C221E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212,182 C218,174 228,174 234,182" fill="none" stroke="#2C221E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Relaxed Eyebrows -->
  <path d="M164,170 C172,166 182,167 189,172" fill="none" stroke="#3B2D26" stroke-width="3" stroke-linecap="round"/>
  <path d="M211,172 C218,167 228,166 236,170" fill="none" stroke="#3B2D26" stroke-width="3" stroke-linecap="round"/>

  <!-- Ears -->
  <circle cx="148" cy="190" r="14" fill="#F2C99D"/>
  <circle cx="252" cy="190" r="14" fill="#F2C99D"/>

  <!-- Long Hair Strands Framing Face -->
  <path d="M142,160 C138,200 144,240 152,260 C146,230 144,190 146,160 Z" fill="#3B2D26"/>
  <path d="M258,160 C262,200 256,240 248,260 C254,230 256,190 254,160 Z" fill="#3B2D26"/>

  <!-- Signature Cap (Worn Backwards/Sporty) -->
  <!-- Cap Crown -->
  <path d="M146,155 C142,95 258,95 254,155 Z" fill="url(#capGrad1)"/>
  <!-- Cap Visor (Backwards curve) -->
  <path d="M136,152 C134,142 266,142 264,152 C255,160 145,160 136,152 Z" fill="#A00D24"/>
  <!-- Cap Stitching Line & Top Button -->
  <path d="M200,95 L200,150" fill="none" stroke="#7A0819" stroke-width="2"/>
  <circle cx="200" cy="97" r="5" fill="#D4AF37"/>

  <!-- Badge at Bottom: Zen & Smiling Coach -->
  <g transform="translate(110, 435)">
    <rect width="180" height="32" rx="16" fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="90" y="21" fill="#D4AF37" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">HEAD COACH • ZEN &amp; CALM</text>
  </g>
</svg>
